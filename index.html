</div>

<script>

    // n8n TEST webhook URL
    const N8N_WEBHOOK_URL =
        "https://bennettfc.app.n8n.cloud/webhook-test/6b3a87e2-90bc-44a9-b5ed-9632000d068f";


    const form = document.getElementById("dateForm");
    const companyNumberInput = document.getElementById("companyNumber");
    const fromDateInput = document.getElementById("fromDate");
    const toDateInput = document.getElementById("toDate");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");
    const submitButton = document.getElementById("submitButton");
    const rangeInfo = document.getElementById("rangeInfo");


    // Show an error message
    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
    }


    // Hide the error message
    function hideError() {
        errorMessage.textContent = "";
        errorMessage.style.display = "none";
    }


    // Calculate difference between dates
    function calculateDifference(fromDate, toDate) {

        const from = new Date(fromDate + "T00:00:00");
        const to = new Date(toDate + "T00:00:00");

        const differenceMilliseconds = to - from;

        return Math.floor(
            differenceMilliseconds / (1000 * 60 * 60 * 24)
        );
    }


    // Validate the dates while the user is filling out the form
    function validateDates() {

        const fromDate = fromDateInput.value;
        const toDate = toDateInput.value;

        rangeInfo.textContent = "";

        if (!fromDate || !toDate) {
            return true;
        }

        const differenceDays = calculateDifference(fromDate, toDate);

        if (differenceDays < 0) {

            showError("The To Date cannot be before the From Date.");

            rangeInfo.textContent = "";
            return false;
        }

        if (differenceDays > 31) {

            showError("The date range cannot be longer than 31 days.");

            rangeInfo.textContent =
                "Current range: " + differenceDays + " days. Maximum: 31 days.";

            return false;
        }

        hideError();

        rangeInfo.textContent =
            "Date range: " + differenceDays + " days.";

        return true;
    }


    // Revalidate whenever either date changes
    fromDateInput.addEventListener("change", validateDates);
    toDateInput.addEventListener("change", validateDates);


    // Submit form
    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        hideError();

        const companyNumber = companyNumberInput.value.trim();
        const fromDate = fromDateInput.value;
        const toDate = toDateInput.value;


        // Check company number
        if (!companyNumber) {

            showError("Please enter a company number.");
            return;
        }


        // Check dates
        if (!fromDate || !toDate) {

            showError("Please enter both a From Date and a To Date.");
            return;
        }


        // Calculate date difference
        const differenceDays =
            calculateDifference(fromDate, toDate);


        // Make sure To Date is not before From Date
        if (differenceDays < 0) {

            showError(
                "The To Date cannot be before the From Date."
            );

            return;
        }


        // Make sure range is no more than 31 days
        if (differenceDays > 31) {

            showError(
                "The date range cannot be longer than 31 days."
            );

            return;
        }


        // Disable button while submitting
        submitButton.disabled = true;
        submitButton.textContent = "Submitting...";


        try {

            const response = await fetch(N8N_WEBHOOK_URL, {

                method: "POST",

                body: JSON.stringify({

                    companyNumber: companyNumber,

                    fromDate: fromDate,

                    toDate: toDate,

                    differenceDays: differenceDays

                })

            });


            if (!response.ok) {

                throw new Error(
                    "Server returned status " + response.status
                );

            }


            // Hide the form
            form.style.display = "none";

            // Show success message
            successMessage.style.display = "block";


        } catch (error) {

            console.error("Submission error:", error);

            showError(
                "There was a problem submitting your request. Please try again."
            );

            submitButton.disabled = false;
            submitButton.textContent = "Submit";

        }

    });

</script>
